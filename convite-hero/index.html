    <script>
      (function () {
        var S = window.SYNC, E = S.ev;
        var tl = gsap.timeline({ paused: true });

        // ------------------------------------------------------------ utilitários
        function shake(t, amp, dur, alvo) {
          // tremor determinístico (sequência fixa), volta ao zero
          var seq = [[1, -0.6], [-0.8, 0.9], [0.7, 0.4], [-0.5, -0.7], [0.35, 0.5], [-0.2, -0.25], [0, 0]];
          var dt = dur / seq.length;
          seq.forEach(function (p, i) {
            var k = 1 - i / seq.length;
            tl.to(alvo || "#cena", { x: p[0] * amp * k, y: p[1] * amp * k, duration: dt, ease: "none" }, t + i * dt);
          });
        }
        function flash(t, op, dur) {
          tl.fromTo("#flash", { opacity: op }, { opacity: 0, duration: dur, ease: "power2.out", immediateRender: false }, t);
        }

        // ------------------------------------------------------------ vídeo
        tl.set("#vwrap", { filter: "blur(0px) brightness(1) saturate(1)" }, 0);
        tl.fromTo("#vwrap", { scale: 1.14, filter: "blur(10px) brightness(1.15) saturate(1)" },
          { scale: 1, filter: "blur(0px) brightness(1) saturate(1)", duration: 0.38, ease: "power3.out", immediateRender: false }, 0);
        // micro "zoom-blur" nos cortes secos
        [1, 2, 3, 4, 6].forEach(function (i) {
          var t = E.seg[i];
          tl.fromTo("#vwrap", { scale: 1.07, filter: "blur(6px) brightness(1.06) saturate(1)" },
            { scale: 1, filter: "blur(0px) brightness(1) saturate(1)", duration: 0.16, ease: "power2.out", immediateRender: false }, t);
        });

        // marca d'água da igreja
        tl.to("#marca", { opacity: 0.92, duration: 0.4 }, 0.4);
        tl.to("#marca", { opacity: 0, duration: 0.15 }, E.lagoinha - 0.2);
        tl.to("#marca", { opacity: 0.92, duration: 0.3 }, E.papel + 0.3);
        tl.to("#marca", { opacity: 0, duration: 0.15 }, E.cartao - 0.05);
        tl.to("#marca", { opacity: 0.92, duration: 0.2 }, E.cartao_fim + 0.05);

        // ------------------------------------------------------------ legendas
        var leg = document.getElementById("leg");
        S.leg.forEach(function (b, i) {
          var el = document.createElement("div");
          el.className = "lg" + (b.modo ? " " + b.modo : "");
          var txt = b.p.map(function (p) { return p.w; }).join(" ");
          var big = /HOMENS/.test(txt) ? 196 : /VEM/.test(txt) ? 300 : 150;
          var fs = Math.min(big, 960 / (0.5 * txt.length));
          el.style.fontSize = fs.toFixed(1) + "px";
          b.p.forEach(function (p, j) {
            var w = document.createElement("span");
            w.className = "w" + (p.c ? " " + p.c : "");
            w.textContent = p.w;
            w.id = "w" + i + "_" + j;
            el.appendChild(w);
          });
          leg.appendChild(el);
          // entrada com rastro (desfoque de movimento lateral), como na referência
          tl.fromTo(el, { opacity: 0, x: 170, scaleX: 1.32, filter: "blur(14px)" },
            { opacity: 1, x: 0, scaleX: 1, filter: "blur(0px)", duration: 0.16, ease: "power3.out", immediateRender: false }, b.s);
          b.p.forEach(function (p, j) {
            var w = "#w" + i + "_" + j;
            if (j > 0) tl.fromTo(w, { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.09, ease: "power2.out", immediateRender: false }, p.t);
            else tl.set(w, { opacity: 1 }, b.s);
            if (p.c === "k") tl.fromTo(w, { scale: 1.22 }, { scale: 1, duration: 0.22, ease: "back.out(3)", immediateRender: false }, p.t);
          });
          tl.to(el, { opacity: 0, x: -120, filter: "blur(10px)", duration: 0.09, ease: "power2.in" }, Math.max(b.s + 0.12, b.e - 0.09));
        });
        // ênfases
        shake(E.homens, 16, 0.32, "#vwrap");
        flash(E.homens, 0.28, 0.18);

        // ------------------------------------------------------------ pino (Patrocínio)
        tl.fromTo("#pino", { opacity: 0, y: -260, scaleY: 1 }, { opacity: 1, y: 0, duration: 0.2, ease: "power2.in", immediateRender: false }, E.pin - 0.05);
        tl.to("#pino", { scaleY: 0.82, scaleX: 1.12, duration: 0.06, ease: "power1.out" }, E.pin + 0.15);
        tl.to("#pino", { scaleY: 1, scaleX: 1, duration: 0.22, ease: "back.out(4)" }, E.pin + 0.21);
        tl.fromTo("#pino-onda", { opacity: 0.95, scale: 0.3 }, { opacity: 0, scale: 1.6, duration: 0.5, ease: "power2.out", immediateRender: false }, E.pin + 0.15);
        tl.to("#pino", { opacity: 0, y: -40, duration: 0.15, ease: "power2.in" }, E.seg[4] - 0.1);

        // ------------------------------------------------------------ Lagoinha: fundo desfocado + logo
        tl.to("#vwrap", { filter: "blur(16px) brightness(0.5) saturate(0.85)", scale: 1.06, duration: 0.22, ease: "power2.out" }, E.lagoinha - 0.12);
        tl.fromTo("#lagoinha", { opacity: 0, scale: 1.35, filter: "blur(12px) drop-shadow(0 0 30px rgba(255,255,255,0.35))" },
          { opacity: 1, scale: 1, filter: "blur(0px) drop-shadow(0 0 30px rgba(255,255,255,0.35))", duration: 0.22, ease: "power3.out", immediateRender: false }, E.lagoinha - 0.06);
        tl.fromTo("#lagoinha-brilho div", { x: 0 }, { x: 1500, duration: 0.6, ease: "power1.inOut", immediateRender: false }, E.lagoinha + 0.12);
        tl.to("#lagoinha", { scale: 1.04, duration: 0.6, ease: "none" }, E.lagoinha + 0.16);

        // ------------------------------------------------------------ colagem A (papel rasgado) em E.papel
        var P = E.papel;
        tl.fromTo("#pa-folha", { y: 0 }, { y: -1990, duration: 0.24, ease: "power3.out", immediateRender: false }, P - 0.28);
        tl.fromTo("#pa-a", { x: 0 }, { x: 1290, duration: 0.2, ease: "power3.out", immediateRender: false }, P - 0.2);
        tl.fromTo("#pa-b", { x: 0 }, { x: -1330, duration: 0.2, ease: "power3.out", immediateRender: false }, P - 0.16);
        tl.fromTo("#pa-duo", { opacity: 0, scale: 0.55, rotation: -10 }, { opacity: 1, scale: 1, rotation: -3, duration: 0.18, ease: "back.out(2.2)", immediateRender: false }, P - 0.14);
        tl.to("#lagoinha", { y: -470, scale: 0.62, duration: 0.18, ease: "power2.inOut" }, P - 0.2);
        // por baixo da folha: o vídeo volta ao normal no corte
        tl.set("#vwrap", { filter: "blur(0px) brightness(1) saturate(1)", scale: 1 }, P - 0.02);
        // tudo sobe e sai rasgando
        tl.to(["#pa-folha", "#pa-a", "#pa-b", "#pa-duo"], { y: "-=2400", duration: 0.24, ease: "power2.in", stagger: 0.02 }, P + 0.04);
        tl.to("#lagoinha", { y: -2400, duration: 0.24, ease: "power2.in" }, P + 0.04);
        tl.set("#lagoinha", { opacity: 0 }, P + 0.4);

        // ------------------------------------------------------------ carimbo HERO
        var H = E.hero;
        tl.fromTo("#hero", { opacity: 0, scale: 2.7, rotation: -14 }, { opacity: 1, scale: 1, rotation: -4, duration: 0.12, ease: "power4.in", immediateRender: false }, H - 0.11);
        shake(H + 0.01, 26, 0.38);
        flash(H + 0.01, 0.55, 0.22);
        tl.to("#hero", { scale: 1.05, duration: 0.45, ease: "power1.out" }, H + 0.02);
        tl.to("#hero", { opacity: 0, y: -380, scale: 0.5, rotation: 8, filter: "blur(10px) drop-shadow(0 18px 30px rgba(0,0,0,0.55))", duration: 0.16, ease: "power3.in" }, E.seg[6] - 0.12);

        // ------------------------------------------------------------ cartão: vídeo vira foto colada + flyer (data)
        var C = E.cartao, CF = E.cartao_fim;
        tl.set("#fundo", { opacity: 1 }, C);
        tl.fromTo("#vwrap", { scale: 1, x: 0, y: 0, rotation: 0 }, { scale: 0.5, x: -238, y: 80, rotation: -5, duration: 0.34, ease: "power3.inOut", immediateRender: false }, C);
        tl.fromTo("#vborda", { opacity: 0 }, { opacity: 1, duration: 0.12, immediateRender: false }, C + 0.04);
        tl.to("#vinheta", { opacity: 0, duration: 0.2 }, C);
        tl.fromTo("#flyer-card", { opacity: 0, x: 620, rotation: 24 }, { opacity: 1, x: 0, rotation: 5, duration: 0.36, ease: "back.out(1.5)", immediateRender: false }, C + 0.12);
        tl.to("#vwrap", { rotation: -4, duration: CF - C - 0.5, ease: "sine.inOut" }, C + 0.36);
        tl.to("#flyer-card", { rotation: 4, y: -12, duration: CF - C - 0.6, ease: "sine.inOut" }, C + 0.5);
        // círculo laranja desenhado na data/horário do flyer
        var circ = document.getElementById("circulo"), len = 560;
        circ.style.strokeDasharray = len; circ.style.strokeDashoffset = len;
        tl.fromTo("#circulo", { strokeDashoffset: len }, { strokeDashoffset: 0, duration: 0.42, ease: "power2.out", immediateRender: false }, E.outubro);
        tl.fromTo("#flyer-card", { scale: 1 }, { scale: 1.07, duration: 0.12, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, E.hora);
        tl.fromTo("#endereco", { opacity: 0, y: 70, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.24, ease: "back.out(2)", immediateRender: false }, E.hora + 0.5);
        // saída: volta à tela cheia para o "VEM!"
        tl.to("#flyer-card", { x: 760, rotation: 26, duration: 0.2, ease: "power3.in" }, CF - 0.2);
        tl.to("#endereco", { y: 420, opacity: 0, duration: 0.18, ease: "power3.in" }, CF - 0.2);
        tl.to("#vwrap", { scale: 1, x: 0, y: 0, rotation: 0, duration: 0.18, ease: "power3.in" }, CF - 0.16);
        tl.to("#vborda", { opacity: 0, duration: 0.06 }, CF - 0.02);
        tl.set("#fundo", { opacity: 0 }, CF + 0.02);
        tl.to("#vinheta", { opacity: 1, duration: 0.1 }, CF);

        // ------------------------------------------------------------ "VEM!"
        flash(E.vem, 0.7, 0.25);
        shake(E.vem + 0.01, 30, 0.42);

        // ------------------------------------------------------------ colagem B: papel sobe e revela o flyer
        var F = E.flyer;
        tl.fromTo("#pb-amarelo", { y: 0 }, { y: -1990, duration: 0.24, ease: "power3.out", immediateRender: false }, F - 0.3);
        tl.fromTo("#pb-creme", { y: 0 }, { y: -1990, duration: 0.24, ease: "power3.out", immediateRender: false }, F - 0.22);
        tl.to(["#pb-creme", "#pb-amarelo"], { y: "-=2500", duration: 0.24, ease: "power2.in", stagger: 0.04 }, F + 0.02);

        // ------------------------------------------------------------ flyer em tela cheia
        tl.fromTo("#flyer-full", { scale: 1.0 }, { scale: 1.07, duration: E.cartela - F + 0.05, ease: "none", immediateRender: false }, F - 0.05);
        tl.fromTo("#brilho", { x: 0 }, { x: 2100, duration: 0.9, ease: "power1.inOut", immediateRender: false }, F + 0.45);
        tl.fromTo("#vem-pro", { opacity: 0, scale: 1.8, rotation: -14 }, { opacity: 1, scale: 1, rotation: -6, duration: 0.14, ease: "power4.in", immediateRender: false }, F + 0.85);
        shake(F + 0.99, 12, 0.25, "#flyer-cena");
        tl.to("#vem-pro", { scale: 1.06, duration: 0.25, yoyo: true, repeat: 3, ease: "sine.inOut" }, F + 1.3);

        // ------------------------------------------------------------ cartela final
        var K = E.cartela;
        tl.fromTo("#ct-pincel", { scaleX: 0 }, { scaleX: 1, duration: 0.28, ease: "power3.out", immediateRender: false }, K + 0.02);
        tl.fromTo("#ct-hero", { opacity: 0, scale: 2.2, rotation: -10 }, { opacity: 1, scale: 1, rotation: -3, duration: 0.14, ease: "power4.in", immediateRender: false }, K + 0.06);
        shake(K + 0.2, 18, 0.3, "#cartela");
        tl.fromTo("#ct-data", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.25, ease: "power3.out", immediateRender: false }, K + 0.42);
        tl.fromTo("#ct-lag", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.28, ease: "power3.out", immediateRender: false }, K + 0.58);
        tl.fromTo("#ct-busca", { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.24, ease: "back.out(2)", immediateRender: false }, K + 0.8);
        var txt = document.getElementById("ct-txt"), handle = "@lagoinhapatrocinio";
        handle.split("").forEach(function (ch, i) {
          var s = document.createElement("span"); s.textContent = ch; s.id = "ch" + i; txt.appendChild(s);
          tl.set("#ch" + i, { opacity: 1 }, K + 1.0 + i * 0.045);
        });
        var cur = document.createElement("i"); cur.className = "cur"; cur.id = "cursor"; txt.appendChild(cur);
        for (var b = 0; b < 8; b++) tl.set("#cursor", { opacity: b % 2 ? 1 : 0 }, K + 1.0 + handle.length * 0.045 + 0.1 + b * 0.22);
        tl.to("#ct-busca", { scale: 1.05, duration: 0.12, yoyo: true, repeat: 1, ease: "power2.out" }, K + 2.05);

        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
      })();
    </script>
